[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet-mcp"
version = "0.1.0.dev0"
description = "An MCP server for Unseenet, built on the Unseenet core"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "unseenet @ git+https://github.com/unseenet/unseenet.git",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
